name: quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libegl1
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format check
        run: ruff format --check src tests tools
      - name: Lint
        run: ruff check src tests tools
      - name: Tests
        run: QT_QPA_PLATFORM=offscreen pytest
      - name: Headless self-test
        run: eric-motion-studio --self-test
      - name: Command audit
        run: eric-motion-studio --audit-commands
      - name: Cutover audit
        run: python tools/cutover_audit.py
      - name: Viewer self-test
        run: eric-motion-studio-viewer --self-test
      - name: Release audit
        run: python tools/release_audit.py
